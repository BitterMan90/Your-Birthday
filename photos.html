<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наши фото</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0f1626;
    --navy-mid:#1b2740;
    --cream:#f3efe6;
    --cream-dim:#c9c4b6;
    --amber:#e8a94c;
    --rose:#c97b84;
  }
  *{box-sizing:border-box;}
  html,body{min-height:100%;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% 0%, var(--navy-mid), var(--navy-deep) 65%);
    font-family:'Work Sans', sans-serif;
    color:var(--cream);
    padding:56px 20px 80px;
  }

  .top{
    text-align:center;
    max-width:640px;
    margin:0 auto 48px;
  }
  .dates{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--amber);
    margin:0 0 18px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(26px, 5vw, 36px);
    line-height:1.2;
    margin:0;
  }

  .gallery{
    max-width:900px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));
    gap:22px;
  }

  figure{
    margin:0;
    border:1px solid rgba(243,239,230,0.18);
    background:rgba(243,239,230,0.03);
    overflow:hidden;
  }
  figure img{
    display:block;
    width:100%;
    height:280px;
    object-fit:cover;
  }
  figcaption{
    padding:14px 16px 18px;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:15px;
    line-height:1.5;
    color:var(--cream-dim);
  }

  .empty-note{
    text-align:center;
    max-width:480px;
    margin:0 auto;
    padding:40px 24px;
    border:1px dashed rgba(243,239,230,0.25);
    color:var(--cream-dim);
    font-size:14px;
    line-height:1.6;
  }

  .back{
    display:block;
    text-align:center;
    margin:50px auto 0;
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--cream-dim);
    text-decoration:none;
  }
  .back:hover{ color:var(--amber); }
</style>
</head>
<body>

<div class="top">
  <p class="dates">17.12 — полгода <span style="color:var(--rose)">·</span> 19.12 — твой день</p>
  <h1>Немного наших моментов</h1>
</div>

<div class="gallery" id="gallery"></div>

<a class="back" href="index.html">← вернуться к пожеланиям</a>

<script>
/* ============================================================
   ПИШИ СЮДА. Один объект — одна фотография.

   1) Создай в репозитории папку "photos" (рядом с index.html)
      и залей туда файлы фотографий.
   2) Впиши сюда имя файла в src (например "photos/1.jpg")
      и подпись в caption (можно оставить пустой "").
   3) Порядок в массиве = порядок показа. Можно добавлять
      и убирать сколько угодно карточек.
   ============================================================ */
const PHOTOS = [
  { src: "photos/1.jpg", caption: "" },
  { src: "photos/2.jpg", caption: "" },
  { src: "photos/3.jpg", caption: "" },
];
/* ============================================================ */

const gallery = document.getElementById('gallery');

if (PHOTOS.length === 0){
  gallery.outerHTML = '<p class="empty-note">Фото пока не добавлены — впиши их в массив PHOTOS в конце файла photos.html.</p>';
} else {
  PHOTOS.forEach(p => {
    const fig = document.createElement('figure');
    const img = document.createElement('img');
    img.src = p.src;
    img.alt = p.caption || '';
    img.loading = 'lazy';
    fig.appendChild(img);
    if (p.caption){
      const cap = document.createElement('figcaption');
      cap.textContent = p.caption;
      fig.appendChild(cap);
    }
    gallery.appendChild(fig);
  });
}
</script>

</body>
</html>
